_schema-version: "3.2"
ID: projectone
version: 0.0.1
modules:
  - name: projectone-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: projectone-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - comprojectoneprojectoneui.zip
          name: comprojectoneprojectoneui
          target-path: resources/
  - name: comprojectoneprojectoneui
    type: html5
    path: projectoneui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
resources:
  - name: projectone-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: projectone-html5-service
      service-plan: app-host
  - name: projectone-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: false
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: projectone-destination-service
      service-plan: lite
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
description: "Build and deployment scripts"
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
